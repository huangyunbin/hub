<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>影视资源合集（持续更新）</title>
<style>
  * { margin: 0; padding: 0; box-sizing: border-box; }
  body {
    font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, "Helvetica Neue", Arial, "PingFang SC", "Hiragino Sans GB", "Microsoft YaHei", sans-serif;
    background: #f5f7fa;
    color: #333;
    line-height: 1.6;
  }
  .header {
    background: linear-gradient(135deg, #667eea 0%, #764ba2 100%);
    color: white;
    padding: 40px 20px;
    text-align: center;
  }
  .header h1 { font-size: 28px; font-weight: 700; }
  .header p { margin-top: 8px; opacity: 0.9; font-size: 14px; }
  .notice {
    max-width: 800px;
    margin: 20px auto;
    padding: 14px 20px;
    background: #fff3cd;
    border-left: 4px solid #ffc107;
    border-radius: 6px;
    font-size: 14px;
  }
  .notice strong { color: #856404; }
  .container { max-width: 800px; margin: 0 auto; padding: 20px; }
  .card {
    background: white;
    border-radius: 10px;
    padding: 20px;
    margin-bottom: 16px;
    box-shadow: 0 2px 8px rgba(0,0,0,0.06);
    transition: box-shadow 0.2s;
  }
  .card:hover { box-shadow: 0 4px 16px rgba(0,0,0,0.12); }
  .card-title { font-size: 18px; font-weight: 600; margin-bottom: 6px; }
  .card-title .fire::before { content: "\01F525"; margin-right: 4px; }
  .card-tags { margin-bottom: 10px; }
  .tag {
    display: inline-block;
    font-size: 12px;
    padding: 2px 8px;
    border-radius: 4px;
    margin-right: 6px;
    margin-bottom: 4px;
  }
  .tag-quality { background: #e8f5e9; color: #2e7d32; }
  .tag-lang { background: #e3f2fd; color: #1565c0; }
  .tag-type { background: #fce4ec; color: #c62828; }
  .links { display: flex; gap: 10px; flex-wrap: wrap; }
  .link-btn {
    display: inline-flex;
    align-items: center;
    padding: 8px 16px;
    border-radius: 6px;
    text-decoration: none;
    font-size: 14px;
    font-weight: 500;
    transition: opacity 0.2s;
  }
  .link-btn:hover { opacity: 0.85; }
  .link-quark { background: #6C5CE7; color: white; }
  .link-baidu { background: #2196F3; color: white; }
  .link-ali { background: #FF6B35; color: white; }
  .footer {
    text-align: center;
    padding: 30px 20px;
    font-size: 13px;
    color: #999;
  }
  .footer a { color: #667eea; text-decoration: none; }
  .search-box {
    max-width: 800px;
    margin: 20px auto 0;
    padding: 0 20px;
  }
  .search-box input {
    width: 100%;
    padding: 12px 16px;
    border: 2px solid #e0e0e0;
    border-radius: 8px;
    font-size: 16px;
    outline: none;
    transition: border-color 0.2s;
  }
  .search-box input:focus { border-color: #667eea; }
  .hidden { display: none !important; }
  @media (max-width: 600px) {
    .header h1 { font-size: 22px; }
    .card { padding: 16px; }
    .links { flex-direction: column; }
    .link-btn { justify-content: center; }
  }
</style>
</head>
<body>

<div class="header">
  <h1>影视资源合集</h1>
  <p>持续更新 · 收藏本页告别剧荒</p>
</div>

<div class="search-box">
  <input type="text" id="searchInput" placeholder="搜索片名..." oninput="filterCards()">
</div>

<div class="notice">
  <strong>使用方法：</strong>长按复制链接，在【夸克】或【百度网盘】APP 中打开，保存即可观看。
</div>

<div class="container" id="cardList">

  <div class="card" data-title="生命树">
    <div class="card-title">生命树</div>
    <div class="card-tags">
      <span class="tag tag-quality">4K 高清</span>
    </div>
    <div class="links">
      <a class="link-btn link-quark" href="https://pan.quark.cn/s/c6ac189f42ed" target="_blank">夸克网盘</a>
      <a class="link-btn link-baidu" href="https://pan.baidu.com/s/1cbfNwbJrBHK-4R3WUJBu1A?pwd=8dw4" target="_blank">百度网盘</a>
    </div>
  </div>

  <div class="card" data-title="老友记">
    <div class="card-title"><span class="fire"></span>老友记 【1-10 季全集】</div>
    <div class="card-tags">
      <span class="tag tag-quality">1080p 高清</span>
      <span class="tag tag-lang">中英双语</span>
      <span class="tag tag-type">美剧</span>
    </div>
    <div class="links">
      <a class="link-btn link-quark" href="https://pan.quark.cn/s/a95ceef1e76f" target="_blank">夸克网盘</a>
      <a class="link-btn link-baidu" href="https://pan.baidu.com/s/12puC-mYHmifFz-sfdiIRMQ?pwd=68jd" target="_blank">百度网盘</a>
    </div>
  </div>

  <div class="card" data-title="亢奋 euphoria">
    <div class="card-title">亢奋 euphoria 【1-2 季全集 + 特别篇】</div>
    <div class="card-tags">
      <span class="tag tag-lang">中英双字</span>
      <span class="tag tag-type">美剧</span>
    </div>
    <div class="links">
      <a class="link-btn link-quark" href="https://pan.quark.cn/s/c8464c3672b9" target="_blank">夸克网盘</a>
    </div>
  </div>

  <div class="card" data-title="夜魔侠">
    <div class="card-title">夜魔侠 【1-3 季 + 重生】</div>
    <div class="card-tags">
      <span class="tag tag-type">美剧</span>
    </div>
    <div class="links">
      <a class="link-btn link-quark" href="https://pan.quark.cn/s/b065f9b1ab0c" target="_blank">夸克网盘</a>
    </div>
  </div>

</div>

<div class="footer">
  <p>资源均来自网络，仅供学习交流</p>
  <p>更多资源请关注微博 <a href="#">@你的微博ID</a></p>
</div>

<script>
function filterCards() {
  const query = document.getElementById('searchInput').value.toLowerCase();
  document.querySelectorAll('.card').forEach(card => {
    const title = card.getAttribute('data-title').toLowerCase();
    const text = card.innerText.toLowerCase();
    card.classList.toggle('hidden', query && !title.includes(query) && !text.includes(query));
  });
}
</script>

</body>
</html>
