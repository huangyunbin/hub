<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>hub</title>
    <style>
      :root {
        --bg: #f4f4f6;
        --card: #ffffff;
        --text: #151515;
        --muted: #5f6470;
        --line: #e6e8ee;
      }
      * { box-sizing: border-box; }
      body {
        margin: 0;
        font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", sans-serif;
        background: linear-gradient(180deg, #f8fafc 0%, #eef2f7 100%);
        color: var(--text);
      }
      main {
        width: min(900px, calc(100% - 32px));
        margin: 40px auto;
      }
      h1 {
        margin: 0 0 8px;
        font-size: 34px;
      }
      p {
        margin: 0;
        color: var(--muted);
      }
      .grid {
        margin-top: 20px;
        display: grid;
        gap: 14px;
      }
      .card {
        display: block;
        text-decoration: none;
        color: inherit;
        background: var(--card);
        border: 1px solid var(--line);
        border-radius: 14px;
        padding: 16px 18px;
      }
      .card:hover {
        border-color: #c9d3e0;
      }
      .title {
        margin: 0 0 6px;
        font-size: 20px;
      }
    </style>
  </head>
  <body>
    <main>
      <h1>hub</h1>
      <p>Static pages index</p>
      <section class="grid">
        <a class="card" href="./apify/">
          <h2 class="title">apify</h2>
          <p>Apify Store Insights static snapshot page.</p>
        </a>
        <a class="card" href="https://github.com/huangyunbin/hub/blob/main/docs/fullstack-to-static-playbook.md" target="_blank" rel="noreferrer">
          <h2 class="title">playbook</h2>
          <p>How to convert full-stack apps into static pages and publish via hub.</p>
        </a>
      </section>
    </main>
  </body>
</html>
